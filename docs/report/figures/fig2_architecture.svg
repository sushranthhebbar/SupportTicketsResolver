<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 335' width='100%' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2937'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2937'/></marker></defs><rect x='10' y='20' width='110' height='60' rx='6' fill='#eff6ff' stroke='#2563eb'/><text x='65.0' y='40' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Ticket</text><text x='65.0' y='57' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>email, chat,</text><text x='65.0' y='71' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>docs, forum</text><rect x='150' y='20' width='130' height='60' rx='6' fill='#eff6ff' stroke='#2563eb'/><text x='215.0' y='40' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Normalise</text><text x='215.0' y='57' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>one shared format</text><text x='215.0' y='71' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>labels kept apart</text><rect x='310' y='20' width='140' height='60' rx='6' fill='#eff6ff' stroke='#2563eb'/><text x='380.0' y='40' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Classify</text><text x='380.0' y='57' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>intent + urgency</text><text x='380.0' y='71' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>(language model)</text><rect x='480' y='20' width='130' height='60' rx='6' fill='#fef3c7' stroke='#d97706'/><text x='545.0' y='40' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Route</text><text x='545.0' y='57' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>router-v4 rules</text><line x1='120' y1='50' x2='150' y2='50' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><line x1='280' y1='50' x2='310' y2='50' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><line x1='450' y1='50' x2='480' y2='50' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><rect x='480' y='130' width='130' height='60' rx='6' fill='#fee2e2' stroke='#dc2626'/><text x='545.0' y='150' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Escalate</text><text x='545.0' y='167' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>specialist; summary</text><text x='545.0' y='181' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>prepared</text><line x1='545' y1='80' x2='545' y2='130' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><rect x='300' y='130' width='150' height='60' rx='6' fill='#eff6ff' stroke='#2563eb'/><text x='375.0' y='150' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Retrieve</text><text x='375.0' y='167' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>29 articles, passages</text><text x='375.0' y='181' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>vector index</text><line x1='480' y1='62' x2='450' y2='150' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><rect x='300' y='230' width='150' height='60' rx='6' fill='#eff6ff' stroke='#2563eb'/><text x='375.0' y='250' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Draft with citations</text><text x='375.0' y='267' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>language model;</text><text x='375.0' y='281' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>sources only</text><line x1='375' y1='190' x2='375' y2='230' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><rect x='120' y='230' width='150' height='60' rx='6' fill='#fef3c7' stroke='#d97706'/><text x='195.0' y='250' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Guardrails</text><text x='195.0' y='267' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>ticket and draft checks</text><text x='195.0' y='281' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>block or pass</text><line x1='300' y1='260' x2='270' y2='260' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><rect x='120' y='130' width='150' height='60' rx='6' fill='#dcfce7' stroke='#16a34a'/><text x='195.0' y='150' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Agent review</text><text x='195.0' y='167' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>read, edit, approve,</text><text x='195.0' y='181' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>reject or escalate</text><line x1='195' y1='230' x2='195' y2='190' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><rect x='480' y='230' width='130' height='60' rx='6' fill='#e5e7eb' stroke='#9ca3af'/><text x='545.0' y='250' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2937'>Decision log</text><text x='545.0' y='267' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>every step recorded</text><text x='545.0' y='281' text-anchor='middle' font-size='11' font-weight='normal' fill='#1f2937'>(SQLite)</text><line x1='450' y1='260' x2='480' y2='260' stroke='#1f2937' stroke-width='1.5' marker-end='url(#a)'/><text x='10' y='320' text-anchor='start' font-size='12' font-weight='normal' fill='#1f2937'>Nothing is sent to a customer: the system ends at the agent's review screen.</text></svg>